<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist de manutenção preventiva em subestação</title>
<meta name="theme-color" content="#ffe600">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eceef0;--card:#fff;--ink:#14181c;--mute:#5b6670;--line:#b9c0c6;--y:#ffe600;--r:#d4202a;--ok:#1a7f3c;--field:#f7f8f9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161a;--card:#1b2127;--ink:#eef1f3;--mute:#9aa5ae;--line:#3a444d;--field:#232b32;--ok:#4ccf7a}}
:root[data-theme="dark"]{--bg:#12161a;--card:#1b2127;--ink:#eef1f3;--mute:#9aa5ae;--line:#3a444d;--field:#232b32;--ok:#4ccf7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,Arial,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;margin:0;letter-spacing:.2px}
main{max-width:820px;margin:0 auto;padding:12px 12px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 12px}
.top h1{font-size:26px;line-height:1.05}
.top small{display:block;color:var(--mute);font:500 13px Barlow,Arial}
button{font:600 15px Barlow,Arial;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:6px;min-height:44px;cursor:pointer}
button.pri{background:var(--y);color:#14181c}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--r);outline-offset:1px}
.item{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--y);padding:12px;margin-bottom:10px;border-radius:4px}
.item.done{border-left-color:var(--ok)}
.item b{font:700 20px "Barlow Condensed",Arial}
.item p{margin:2px 0 10px;color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:28px 12px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:6px}
.warn{background:var(--r);color:#fff;font:700 13px Barlow,Arial;padding:8px 10px;text-align:center;margin-bottom:10px}
.sec{background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.sec>h2{background:var(--y);color:#14181c;font-size:20px;padding:6px 10px;text-transform:uppercase}
.body{padding:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.fld{display:flex;flex-direction:column;gap:2px;grid-column:span 6;min-width:0}
.fld.h{grid-column:span 3}.fld.t{grid-column:span 2}
.fld>span{font:600 12px Barlow,Arial;color:var(--mute)}
input,select,textarea{font:16px Barlow,Arial;width:100%;padding:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:4px;min-height:42px}
textarea{min-height:110px}
.chk{grid-column:span 6;border-top:1px solid var(--line);padding-top:8px}
.chk p{margin:0 0 6px;font-size:15px}
.st{display:flex;gap:6px}
.st button{flex:1;padding:6px;min-height:40px}
.st button.on[data-v=OK]{background:var(--ok);border-color:var(--ok);color:#fff}
.st button.on[data-v=NOK]{background:var(--r);border-color:var(--r);color:#fff}
.st button.on[data-v="N/A"]{background:var(--mute);border-color:var(--mute);color:#fff}
.ph{grid-column:span 2;min-width:0}.ph,.pin{display:flex;flex-direction:column;gap:6px}
.ph .box{aspect-ratio:4/3;border:2px dashed var(--line);background:var(--field);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:14px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph input[type=file]{display:none}
.rq{color:var(--r);font-weight:700}.sec>h2 .rq{color:#b00010}
.leg{grid-column:span 6;font-size:13px;color:var(--mute)}
.tbl{grid-column:span 6;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{border:1px solid var(--line);padding:4px;text-align:center;font-size:14px}
th{background:var(--field);font-weight:600}
td input,td select{min-height:38px;padding:6px;min-width:64px}
.kv{background:var(--r);color:#fff;font-weight:700}
.sub{grid-column:span 6;font:700 16px "Barlow Condensed",Arial;margin-top:6px}
canvas{width:100%;height:130px;border:1px dashed var(--mute);background:#fff;touch-action:none;border-radius:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ink);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.bar button{flex:1;max-width:240px}
.msg{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:9}
@media (max-width:520px){.fld.h,.fld.t,.ph{grid-column:span 6}}
@media print{.top button,.ph .acts,.bar,.msg,.st button:not(.on){display:none}body{background:#fff;color:#000}.sec{break-inside:avoid}.top{display:block}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var DBN='chk-subestacao',DB,svcs=[],chks=[],svc=null,st=null,cid=null,keys=[];
var OPT=['umid','temp','obs'],UM=['kΩ','MΩ','GΩ'],UO=['µΩ','mΩ','Ω'];
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var d=document.createElement('div');d.className='msg';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2800)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function up(a,o){var i=a.findIndex(function(r){return r.id===o.id});if(i<0)a.unshift(o);else a[i]=o}
/* armazenamento (IndexedDB) */
function dbOpen(){return new Promise(function(ok,no){var q=indexedDB.open(DBN,1);q.onupgradeneeded=function(){q.result.createObjectStore('s',{keyPath:'id'});q.result.createObjectStore('c',{keyPath:'id'})};q.onsuccess=function(){DB=q.result;ok()};q.onerror=function(){no(q.error)}})}
function dbAll(s){return new Promise(function(ok,no){var q=DB.transaction(s).objectStore(s).getAll();q.onsuccess=function(){ok(q.result)};q.onerror=function(){no(q.error)}})}
function dbPut(s,o){try{var t=DB.transaction(s,'readwrite');t.objectStore(s).put(o);t.onabort=function(){toast('Sem espaço para salvar. Libere memória do aparelho.')}}catch(e){toast('Armazenamento indisponível.')}}
function dbDel(s,id){try{DB.transaction(s,'readwrite').objectStore(s).delete(id)}catch(e){}}
function saveS(){svc.upd=Date.now();up(svcs,svc);dbPut('s',svc)}
function saveC(){st.upd=Date.now();up(chks,st);dbPut('c',st);if(svc)saveS()}

/* modelos de checklist */
var EQ_T=[['fabricante','Fabricante','t'],['ano','Ano','t','text','inputmode="numeric"'],['serie','Nº de série','t'],['tp','Tensão primária','t'],['ts','Tensão secundária','t'],['pot','Potência','t'],['tipo','Tipo','t','sel'],['umid','Umidade (%)','t','text','inputmode="decimal"'],['temp','Temperatura (°C)','t','text','inputmode="decimal"']];
var EQ_D=[['fabricante','Fabricante','t'],['ano','Ano','t','text','inputmode="numeric"'],['serie','Nº de série','t'],['corrente','Corrente nominal (A)','h'],['tensao','Tensão nominal (kV)','h'],['umid','Umidade (%)','h','text','inputmode="decimal"'],['temp','Temperatura (°C)','h','text','inputmode="decimal"']];
var IT_T=['Verificar conexão ao aterramento','Verificar condições do cabo de aterramento','Levantamento do tap atual do transformador','Verificar a existência de trincas ou fissuras nas buchas','Reapertar as isoladores e conexões - barramentos/barramentos - com limpeza geral','Reapertar as isoladores e conexões - barramentos/cabos de alta tensão - com limpeza geral','Reaperto das isoladores e conexões - cabos de alta/conectores - com limpeza geral','Reapertar as isoladores e conexões - conectores/equipamentos - com limpeza geral','Reapertar dos conectores eletromecânicos (na saída dos transformadores de baixa tensão)','Inspeção do nível de óleo','Verificação de vazamento de óleo isolante','Verificação dos anéis de vedação','Limpeza geral no equipamento','Existência do sensor de temperatura do transformador','Verificação do funcionamento do sensor de temperatura do transformador','Verificação do tanque de expansão, caso exista','Coleta de amostra de óleo para análise em laboratório','Executar pintura dos barramentos de alta tensão'];
var IT_D=['Limpeza geral cuidadosa do conjunto','Verificar o estado geral das travas, motor e articulações (limpeza e lubrificação)','Verificação nos blocos de terminais, fiações e isoladores quanto à presença de trincas ou rachaduras','Verificar a carcaça e as câmaras quanto a trincas/rachaduras, etc.','Verificar o aterramento da base','Verificar se os contatos de rolete estão limpos e lubrificados','Verificar o aperto dos parafusos e conexões','Verificar as bobinas de acionamento','Verificar nível de óleo do disjuntor','Verificar as vedações do disjuntor','Verificar a existência de vazamentos','Existe relé de proteção?','O relé de proteção é primário ou secundário?','Verificar os comandos de acionamento','Qual a marca do relé de proteção?','O relé está operando?','Existe nobreak?','Manutenção dos relés de proteção primária: limpeza, verificação da lubrificação, existência de trincas, etc.'];
var IT_C=['Verificar estado dos isoladores','Verificar o estado dos contatos móveis','Verificar o reaperto, limpeza e lubrificação das articulações, partes rotativas e contatos','Verificar se existe trinca ou rachaduras nos isoladores','Verificar se os isoladores estão bem fixos','Efetuar limpeza dos isoladores','Verificar o ajuste dos limites de abertura e fechamento','Verificação das condições das facas','Verificar estado dos suportes','Verificar estado dos elos fusíveis'];
var TY={
 trafo:{n:'Transformador',items:IT_T,eq:EQ_T,mid:midT,no:'6'},
 disj:{n:'Disjuntor de média',items:IT_D,eq:EQ_D,mid:midD,no:'4'},
 chave:{n:'Chave seccionadora',items:IT_C,eq:EQ_D,mid:midC,no:'4'}
};
var PHN={trafo:'Transformador',disj:'Disjuntor',chave:'Chave seccionadora'};
function phName(i){var n=PHN[st.type];return [n+' antes da manutenção',n+' após a manutenção','Placa de identificação'][i]}

/* campos */
function src(k){return (k.indexOf('c_')===0?svc:st).f}
function v(k){return src(k)[k]||''}
function rq(k){return OPT.indexOf(k)<0?' <b class="rq">*</b>':''}
function inp(k,l,w,t,x){keys.push(k);return '<label class="fld '+(w||'')+'"><span>'+l+rq(k)+'</span><input data-k="'+k+'" type="'+(t||'text')+'" value="'+esc(v(k))+'" '+(x||'')+'></label>'}
function cell(k){keys.push(k);return '<input data-k="'+k+'" inputmode="decimal" value="'+esc(v(k))+'">'}
function sel(k,opts,l,w){keys.push(k);return '<label class="fld '+(w||'')+'"><span>'+l+rq(k)+'</span><select data-k="'+k+'"><option value="">Selecione</option>'+opts.map(function(o){return '<option'+(v(k)===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select></label>'}
function usel(k,opts,d){var f=src(k);if(!f[k])f[k]=d;return '<select data-k="'+k+'">'+opts.map(function(o){return '<option'+(f[k]===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'}
function sec(t,b){return '<section class="sec"><h2>'+t+'</h2><div class="body">'+b+'</div></section>'}
var STAR=' <span class="rq">*</span>';
function cust(){return sec('Dados do serviço e do cliente',inp('c_servico','Serviço / OS','h')+inp('c_empresa','Empresa','h')+inp('c_cnpj','CNPJ','h','text','inputmode="numeric"')+inp('c_endereco','Endereço','h')+inp('c_numero','Nº','t')+inp('c_bairro','Bairro','t')+inp('c_cidade','Cidade','h')+inp('c_cep','CEP','t','text','inputmode="numeric"')+inp('c_uf','UF','t')+inp('c_resp','Responsável técnico','h')+inp('c_tel','Telefone','h','tel'))}

/* seções específicas */
function contato(n){var t='<div class="tbl"><table><tr><th>Fase</th><th>Valor medido</th><th>Unidade</th></tr>';['R','S','T'].forEach(function(f,i){t+='<tr><td>'+f+'</td><td>'+cell('rc'+i)+'</td><td>'+usel('rcu'+i,UO,'µΩ')+'</td></tr>'});return sec(n+' - Resistência de contato (micro-ohmímetro)'+STAR,t+'</table></div>')}
function midT(){
 var T=['30 seg.','1 min.','3 min.','5 min.','10 min.'],M=[['H','X','MASSA','2,5 kV'],['H','MASSA','X','2,5 kV'],['X','MASSA','H','0,5 kV']];
 var m='<div class="tbl"><table><tr><th>Tensão<br>vermelho</th><th>Retorno<br>preto</th><th>Guard<br>azul</th><th>Tensão</th>'+T.map(function(t,i){return '<th>'+(i+1)+'º<br>'+t+'</th>'}).join('')+'<th>Unidade</th></tr>';
 M.forEach(function(r,i){m+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="kv">'+r[3]+'</td>'+T.map(function(t,j){return '<td>'+cell('m'+i+'_'+j)+'</td>'}).join('')+'<td>'+usel('mu'+i,UM,'MΩ')+'</td></tr>'});
 var DY=[['H1-H3','X1-X0'],['H2-H1','X2-X0'],['H3-H2','X3-X0']],YD=[['H1-H0','X1-X2'],['H0-H2','X2-X3'],['H0-H3','X3-X1']];
 var t='<div class="sub">D-Y [Dy5]</div><div class="tbl"><table><tr><th>Conexão</th><th>Medido</th></tr>';
 DY.forEach(function(r,i){t+='<tr><td>'+r[0]+' / '+r[1]+'</td><td>'+cell('t1_'+i)+'</td></tr>'});
 t+='</table></div><div class="sub">Y-D [Yd5]</div><div class="tbl"><table><tr><th>Conexão</th><th>Medido</th></tr>';
 YD.forEach(function(r,i){t+='<tr><td>'+r[0]+' / '+r[1]+'</td><td>'+cell('t2_'+i)+'</td></tr>'});
 var P=['H1-H2','H1-H3','H2-H3'],S=['X0-X1','X0-X2','X0-X3'];
 var o='<div class="tbl"><table><tr><th colspan="2">Enrolamento primário</th><th colspan="2">Enrolamento secundário</th></tr>';
 for(var i=0;i<3;i++)o+='<tr><td>'+P[i]+'</td><td>'+cell('op'+i)+'</td><td>'+S[i]+'</td><td>'+cell('os'+i)+'</td></tr>';
 o+='</table></div><label class="fld"><span>Unidade</span>'+usel('ou',UO,'mΩ')+'</label>';
 var B=['R ~ T','R ~ S','S ~ T','R ~ N','S ~ N','T ~ N'];
 var b='<div class="tbl"><table><tr><th>Equipamento</th><th>Nº de série</th>'+B.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr><tr><td>Transformador</td><td>'+cell('btserie')+'</td>'+B.map(function(x,i){return '<td>'+cell('bt'+i)+'</td>'}).join('')+'</tr></table></div>';
 return sec('2 - Resistência de isolação entre pólos (megômetro)'+STAR,m+'</table></div>')+sec('3 - Relação de transformação (TTR)'+STAR,t+'</table></div>')+sec('4 - Resistência ôhmica dos enrolamentos (micro-ohmímetro)'+STAR,o)+sec('5 - Tensão - baixa tensão'+STAR,b);
}
function midD(){
 var m='<div class="tbl"><table><tr><th rowspan="2">Fase</th><th colspan="3">Aberto<br>entrada - saída</th><th colspan="3">Fechado<br>entrada/saída - massa</th></tr><tr><th>Tensão</th><th>Valor</th><th>Unid.</th><th>Tensão</th><th>Valor</th><th>Unid.</th></tr>';
 ['R','S','T'].forEach(function(f,i){m+='<tr><td>'+f+'</td><td class="kv">2,5 kV</td><td>'+cell('da'+i)+'</td><td>'+usel('dau'+i,UM,'MΩ')+'</td><td class="kv">2,5 kV</td><td>'+cell('df'+i)+'</td><td>'+usel('dfu'+i,UM,'MΩ')+'</td></tr>'});
 m+='</table></div><p class="leg"><b>Aberto:</b> teste de resistência de isolamento entre entrada e saída do disjuntor.<br><b>Fechado:</b> teste de resistência de isolamento entre os polos e a massa do disjuntor.</p>';
 return sec('2 - Resistência de isolação entre pólos'+STAR,m)+contato('3');
}
function midC(){
 var m='<div class="tbl"><table><tr><th>Tensão<br>vermelho</th><th>Retorno<br>preto</th><th>Guard<br>azul</th><th>Tensão</th><th>Resistência de isolação<br>(1 min.)</th><th>Unidade</th></tr><tr><td>POLOS</td><td>MASSA</td><td>-</td><td class="kv">2,5 kV</td><td>'+cell('cm')+'</td><td>'+usel('cmu',UM,'MΩ')+'</td></tr></table></div>';
 return sec('2 - Resistência de isolação entre pólos (megômetro)'+STAR,m)+contato('3');
}
function phInner(i){i=+i;var k='foto'+i,has=!!st.f[k];return '<div class="fld"><span>'+(i+1)+' - '+phName(i)+rq(k)+'</span></div><div class="box">'+(has?'<img src="'+esc(st.f[k])+'" alt="'+phName(i)+'">':'Sem foto')+'</div><div class="acts row"><button data-a="ph" data-id="'+i+'">'+(has?'Trocar foto':'Tirar foto')+'</button>'+(has?'<button data-a="rm" data-id="'+i+'">Remover</button>':'')+'</div>'}
function shrink(file,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.onerror=function(){toast('Não foi possível ler a foto.')};im.src=fr.result};fr.readAsDataURL(file)}
function build(ty){
 var T=TY[ty],h='<div class="warn">ATENÇÃO: TODAS AS INFORMAÇÕES DEVERÃO SER PREENCHIDAS OU JUSTIFICADAS</div><p class="leg"><b class="rq">*</b> campo obrigatório. Se não se aplica, justifique na observação.</p>'+cust();
 h+=sec('Dados do equipamento',T.eq.map(function(f){return f[3]==='sel'?sel(f[0],['Seco','Óleo'],f[1],f[2]):inp(f[0],f[1],f[2],'text',f[4])}).join(''));
 var c='';T.items.forEach(function(t,i){var k='s'+i;keys.push(k);var s=st.f[k];c+='<div class="chk"><p>1.'+(i+1)+' - '+t+rq(k)+'</p><div class="st">'+['OK','NOK','N/A'].map(function(o){return '<button data-a="st" data-id="'+k+'" data-v="'+o+'" class="'+(s===o?'on':'')+'">'+o+'</button>'}).join('')+'</div></div>'});
 c+='<div class="leg"><b>OK</b> em conformidade · <b>NOK</b> inconforme · <b>N/A</b> não se aplica</div>';
 h+=sec('1 - Checklist',c)+T.mid();
 var ph='';[0,1,2].forEach(function(i){keys.push('foto'+i);ph+='<div class="ph"><div class="pin" id="pi'+i+'">'+phInner(i)+'</div><input type="file" accept="image/*" id="f'+i+'"></div>'});
 h+=sec('Registro fotográfico'+STAR,ph);
 keys.push('obs');
 h+=sec(T.no+' - Observação / justificativas','<label class="fld"><span>Justifique campos não preenchidos e registre ocorrências</span><textarea data-k="obs">'+esc(v('obs'))+'</textarea></label>'+inp('nome','Nome','h')+inp('funcao','Função','h')+inp('cpf','CPF','h','text','inputmode="numeric"')+inp('data','Data','h','date')+'<div class="fld"><span>Assinatura (desenhe com o dedo)'+rq('sig')+'</span><canvas id="sig"></canvas><button id="clr" style="margin-top:6px">Limpar assinatura</button></div>');
 return h;
}
function calc(c,s){var o=st,p=svc,k0=keys;st=c;svc=s;keys=[];build(c.type);var n=keys.filter(function(k){return OPT.indexOf(k)<0&&!String(src(k)[k]||'').trim()}).length+(c.f.sig?0:1);st=o;svc=p;keys=k0;return n}

/* telas */
var app=$('#app');
function list(){
 svc=st=null;
 var h='<div class="top"><div><h1>Checklist de manutenção preventiva em subestação<small>Prioridade Engenharia · funciona sem internet</small></h1></div><button class="pri" data-a="new">Novo serviço</button></div>';
 if(!svcs.length)h+='<div class="empty">Nenhum serviço salvo neste aparelho.<br>Toque em “Novo serviço” para começar.</div>';
 svcs.slice().sort(function(a,b){return (b.upd||0)-(a.upd||0)}).forEach(function(s){
  var cs=chks.filter(function(c){return c.sid===s.id}),d=cs.filter(function(c){return calc(c,s)===0}).length,ok=cs.length&&d===cs.length;
  h+='<div class="item '+(ok?'done':'')+'"><b>'+esc(s.f.c_servico||s.f.c_empresa||'Sem nome')+'</b><p>'+esc(s.f.c_empresa||'—')+' · '+cs.length+' checklist(s) · '+d+' completo(s)</p><div class="row"><button data-a="os" data-id="'+s.id+'">Abrir</button><button data-a="ds" data-id="'+s.id+'">'+(cid===s.id?'Confirmar exclusão':'Excluir')+'</button></div></div>';
 });
 h+='<div class="row" style="margin-top:14px"><button data-a="bk">Baixar backup</button><button data-a="rs">Restaurar backup</button><input type="file" id="rsf" accept=".json,application/json" hidden></div><p class="leg" style="color:var(--mute);font-size:13px;margin-top:10px">Os dados ficam salvos neste aparelho, mesmo sem internet. Gere o PDF de cada checklist concluído e baixe um backup de vez em quando.</p>';
 app.innerHTML=h;
}
function svcView(){
 st=null;keys=[];
 app.innerHTML='<div class="top"><div><h1>Serviço<small>Dados do cliente e checklists</small></h1></div><button data-a="bl">Voltar</button></div>'+cust()+'<section class="sec"><h2>Checklists deste serviço</h2><div class="body"><div class="fld" id="cl"></div><div class="row" style="grid-column:span 6"><button class="pri" data-a="add" data-id="trafo">+ Transformador</button><button class="pri" data-a="add" data-id="disj">+ Disjuntor de média</button><button class="pri" data-a="add" data-id="chave">+ Chave seccionadora</button></div></div></section>';
 cl();
}
function cl(){
 var cs=chks.filter(function(c){return c.sid===svc.id}),h='';
 if(!cs.length)h='<div class="empty">Nenhum checklist neste serviço. Adicione abaixo.</div>';
 cs.slice().sort(function(a,b){return (a.id>b.id)-(a.id<b.id)}).forEach(function(c){var n=calc(c,svc);
  h+='<div class="item '+(n?'':'done')+'"><b>'+TY[c.type].n+'</b><p>Série: '+esc(c.f.serie||'—')+' · '+(n?n+' campo(s) pendente(s)':'Completo')+'</p><div class="row"><button data-a="oc" data-id="'+c.id+'">Abrir</button><button data-a="dc" data-id="'+c.id+'">'+(cid===c.id?'Confirmar exclusão':'Excluir')+'</button></div></div>'});
 $('#cl').innerHTML=h;
}
function chkView(){
 keys=[];
 app.innerHTML='<div class="top"><div><h1>'+TY[st.type].n+'<small>Checklist de inspeção técnica · salva sozinho</small></h1></div><button data-a="bs">Voltar ao serviço</button></div><p class="leg" style="color:var(--mute);font-size:13px;margin:0 0 8px">Prioridade Engenharia e Comércio LTDA · Av. Júlia Maksoud, 496, Monte Castelo · Campo Grande - MS</p>'+build(st.type)+'<div class="bar"><button data-a="pdf">Imprimir / PDF</button><button class="pri" data-a="save">Salvar</button></div>';
 sig();
}
function sig(){
 var cv=$('#sig'),r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
 var x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#14181c';
 if(st.f.sig){var im=new Image();im.onload=function(){x.drawImage(im,0,0,r.width,r.height)};im.src=st.f.sig}
 var d=false;function pt(e){var q=cv.getBoundingClientRect();return[e.clientX-q.left,e.clientY-q.top]}
 cv.onpointerdown=function(e){d=true;cv.setPointerCapture(e.pointerId);var p=pt(e);x.beginPath();x.moveTo(p[0],p[1])};
 cv.onpointermove=function(e){if(!d)return;var p=pt(e);x.lineTo(p[0],p[1]);x.stroke()};
 cv.onpointerup=function(){if(!d)return;d=false;st.f.sig=cv.toDataURL('image/png');saveC()};
 $('#clr').onclick=function(){x.clearRect(0,0,r.width,r.height);delete st.f.sig;saveC()};
}

/* eventos */
app.oninput=app.onchange=function(e){
 var t=e.target;
 if(t.id==='rsf'){var f=t.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result);o.s.forEach(function(x){up(svcs,x);dbPut('s',x)});o.c.forEach(function(x){up(chks,x);dbPut('c',x)});toast('Backup restaurado.');list()}catch(x){toast('Arquivo de backup inválido.')}};fr.readAsText(f);return}
 if(t.type==='file'){var i=+t.id.slice(1),fl=t.files[0];if(fl)shrink(fl,function(d){st.f['foto'+i]=d;saveC();$('#pi'+i).innerHTML=phInner(i)});t.value='';return}
 var k=t.dataset&&t.dataset.k;if(!k)return;
 var s=k.indexOf('c_')===0;(s?svc:st).f[k]=t.value;if(s)saveS();else saveC();
};
app.onclick=function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=b.dataset.id;
 if(a==='new'){svc={id:'s'+Date.now(),f:{}};svcView()}
 else if(a==='os'){svc=svcs.find(function(s){return s.id===id});cid=null;svcView()}
 else if(a==='ds'){if(cid===id){svcs=svcs.filter(function(s){return s.id!==id});chks.filter(function(c){return c.sid===id}).forEach(function(c){dbDel('c',c.id)});chks=chks.filter(function(c){return c.sid!==id});dbDel('s',id);cid=null}else cid=id;list()}
 else if(a==='bl'){cid=null;list()}
 else if(a==='add'){
  var last=chks.filter(function(c){return c.sid===svc.id}).sort(function(x,y){return (y.upd||0)-(x.upd||0)})[0];
  st={id:'c'+Date.now(),sid:svc.id,type:id,f:{data:today()}};
  if(last)['nome','funcao','cpf','data','sig'].forEach(function(k){if(last.f[k])st.f[k]=last.f[k]});
  chkView()}
 else if(a==='oc'){st=chks.find(function(c){return c.id===id});chkView()}
 else if(a==='dc'){if(cid===id){chks=chks.filter(function(c){return c.id!==id});dbDel('c',id);cid=null}else cid=id;cl()}
 else if(a==='bs'){st=null;cid=null;svcView()}
 else if(a==='st'){st.f[id]=st.f[id]===b.dataset.v?'':b.dataset.v;b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x.dataset.v===st.f[id])});saveC()}
 else if(a==='ph'){$('#f'+id).click()}
 else if(a==='rm'){delete st.f['foto'+id];saveC();$('#pi'+id).innerHTML=phInner(id)}
 else if(a==='save'){saveC();var n=calc(st,svc);toast(n?'Salvo. '+n+' campo(s) pendente(s): preencha ou justifique.':'Salvo. Checklist completo.')}
 else if(a==='pdf'){saveC();var t0=document.title;document.title=TY[st.type].n+' - '+(svc.f.c_empresa||'')+' - '+(st.f.serie||'');try{window.print()}catch(x){toast('Impressão indisponível aqui.')}setTimeout(function(){document.title=t0},1500)}
 else if(a==='bk'){var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify({s:svcs,c:chks})],{type:'application/json'}));l.download='backup-subestacao-'+today()+'.json';l.click()}
 else if(a==='rs'){$('#rsf').click()}
};
dbOpen().then(function(){return Promise.all([dbAll('s'),dbAll('c')])}).then(function(r){svcs=r[0];chks=r[1];list()}).catch(function(){toast('Armazenamento indisponível neste navegador.');list()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js')});
</script>
